<style>/* pricing v2 */
#pricing{background:#111C27!important}
.pr-wrap{max-width:1180px;margin:0 auto;padding:104px 24px 96px}
.pr-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:48px}
.pr-head h2{margin:0;font-family:'Young Serif',serif;font-weight:400;font-size:clamp(30px,3.6vw,44px);color:#fff}
.pr-lede{margin:4px 0 0;font-family:'Young Serif',serif;font-size:clamp(19px,1.8vw,23px);color:#EEF1F2;max-width:30em}
.pr-lede em{font-style:normal;color:#FFE29A}
.pr-sub{margin:0;font-size:16px;color:#A9BAC5}
.pr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
.pr{font-family:Figtree,system-ui,sans-serif;position:relative;display:flex;flex-direction:column;background:#F7F9FA;color:#1B2A38;border-radius:26px;padding:30px 28px 28px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.pr header h3{margin:0;font-family:'Young Serif',serif;font-weight:400;font-size:25px;line-height:1.2}
.pr-best{margin:6px 0 0;font-size:14.5px;line-height:1.45;color:#5A6B79;min-height:42px}
.pr-price{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.pr-amt{font-family:Figtree,system-ui,sans-serif;font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em}
.pr-unit{font-size:15px;color:#5A6B79}
.pr-len{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1B2A38;background:#E4E9EC;border-radius:999px;padding:5px 12px}
.pr-prob{margin:18px 0 20px;font-family:Caveat,cursive;font-size:23px;line-height:1.2;color:#B8452F}
.pr-k{display:block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A6410;margin-bottom:10px}
.pr ul{list-style:none;margin:0 0 22px;padding:16px 0 0;border-top:1px solid #DCE3E7;display:flex;flex-direction:column;gap:11px;flex:1}
.pr li{display:grid;grid-template-columns:34px 1fr;align-items:baseline;gap:8px}
.pr li b{font-family:Figtree,system-ui,sans-serif;font-weight:700;font-size:19px;line-height:1;color:#1B2A38;text-align:center}
.pr li span{font-size:15px;line-height:1.4}
.pr li small{display:block;font-size:13px;color:#6F8494;margin-top:2px}
.pr-note{margin:-6px 0 16px;font-size:13px;line-height:1.45;color:#5A6B79;background:#EEF1F2;border-radius:12px;padding:10px 12px}
.pr-btn{display:block;text-align:center;text-decoration:none;border-radius:999px;padding:13px 20px;font-weight:500;font-size:15px;border:1.5px solid #1B2A38;color:#1B2A38!important}
.pr-btn:hover{background:#1B2A38;color:#fff!important}
.pr.hot{background:#1B2A38;color:#EEF1F2;border:1.5px solid #FFE29A;box-shadow:0 0 0 6px rgba(255,226,154,.10),0 30px 60px rgba(0,0,0,.5);transform:translateY(-10px)}
.pr.hot .pr-best,.pr.hot .pr-unit{color:#A9BAC5}
.pr.hot .pr-len{background:rgba(255,226,154,.14);color:#FFE29A}
.pr.hot .pr-prob{color:#FFE29A}
.pr.hot .pr-k{color:#FFE29A}
.pr.hot ul{border-top-color:#2C4157}
.pr.hot li b{color:#FFE29A}
.pr.hot li small{color:#93A6B4}
.pr.hot .pr-btn{background:#FFE29A;border-color:#FFE29A;color:#1B2A38!important}
.pr.hot .pr-btn:hover{background:#fff;border-color:#fff}
.pr-badge{position:absolute;top:-13px;right:24px;background:#E36F5A;color:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700}
.pr-more{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px}
.pr-team,.pr-extras{border:1px solid #2C4157;border-radius:24px;padding:26px 28px;background:rgba(34,53,74,.45)}
.pr-team .pr-k,.pr-extras .pr-k{color:#FFE29A}
.pr-team h3{margin:0 0 8px;font-family:'Young Serif',serif;font-weight:400;font-size:24px;color:#fff}
.pr-team h3 span{color:#FFE29A}
.pr-team p{margin:0 0 14px;font-size:15px;line-height:1.5;color:#C6D3DB}
.pr-from{font-size:15px;color:#A9BAC5;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pr-from b{font-family:'Young Serif',serif;font-weight:400;font-size:24px;color:#fff}
.pr-from a{margin-left:0;font-size:16px;color:#FFE29A!important;font-weight:500;text-underline-offset:4px}
.pr-extras ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pr-extras li::before{content:'+';color:#FFE29A;font-weight:700;margin-right:10px}.pr-extras li{display:flex;justify-content:flex-start;gap:12px;padding:9px 0;border-bottom:1px dashed #2C4157;font-size:15px;color:#EEF1F2}
.pr-extras li:last-child{border-bottom:0}
.pr-extras li b{font-weight:500;color:#FFE29A;white-space:nowrap}
@media (max-width:900px){.pr-grid,.pr-more{grid-template-columns:1fr}.pr.hot{transform:none;order:-1}.pr-best{min-height:0}.pr-wrap{padding:64px 18px}}
</style>
